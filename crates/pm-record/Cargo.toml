[package]
name = "pm-record"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.85"

[dependencies]
pm-schema = { path = "../pm-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
as_conversions = "warn"
integer_division = "warn"
