[package]
name = "market-math"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Zero-dependency numeric helpers: summary statistics, quantiles, rolling windows, indicators, intervals and bootstrap."

[dependencies]

[lints.rust]
