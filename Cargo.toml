[package]
name = "market-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"

[features]
default = []
network = ["dep:reqwest", "dep:tokio", "dep:futures-util", "dep:tokio-tungstenite"]
vision = ["network", "dep:zip", "dep:sha2"]

[dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
sha2 = { version = "0.10", optional = true }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
as_conversions = "warn"
integer_division = "warn"

[[example]]
name = "candles"
required-features = ["network"]

[workspace]
members = ["crates/pm-record", "crates/pm-schema"]
resolver = "3"
